 const T=g.away.score!=null&&g.home.score!=null&&s!==2?g.away.score+g.home.score:null,canc=/POSTPONED|CANCEL|SUSPENDED/.test(g.name||"");
 const res=(ln,o)=>T==null||canc?null:T>ln?(o==="o"?"won":"lost"):null;
 const sk=wgraph(g,ou),mb=sk?' style="bottom:48px"':"";const R=res(bet,ou);if(R){const sc={won:"#1fbf5f",lost:"#e5484d"}[R];const dif=B.filter(b=>b.line!==bet||b.ou!==ou).map(b=>[b,res(b.line,b.ou)]).filter(([b,r])=>r!==R).map(([b,r])=>`${f(b.line)} ${r||"open"}`);
  const tl=`Your ${ou==="o"?"over":"under"} ${bet}: ${R} (${T} points so far)${dif.length?" · "+dif.join(", "):""}`;
  return `<div class="mtr" title="${esc(tl)}" style="background:${sc}${sk?";bottom:48px":""}"><span class="ml" style="top:38%;color:${sc}">${R.toUpperCase()}</span><span class="ml" style="top:52%;color:#eef2f7">${T}</span>${dif.map((x,i)=>`<span class="ml" style="top:${66+i*11}%;color:#8b97a8;font-weight:700;font-size:8.5px">${esc(x)}</span>`).join("")}</div>`+sk;}
 const rng=Math.max(8,(v!=null?Math.abs(v-bet):0)+3,...sec2.map(x=>Math.abs(x-bet)+1)),pos=x=>Math.min(100,Math.max(0,(bet+rng-x)/(2*rng)*100));
 const good=v==null||v===bet?null:(ou==="o"?v>bet:v<bet),col=good==null?"#8b97a8":good?"#39e27d":"#ff6b6b";
 let h=`<div class="mtr"${mb} title="Your ${ou==="o"?"over":"under"} ${bet}${v!=null?` · live ${v}`:""}">`;
 for(const x of sec2)h+=`<i class="m2" style="top:${pos(x)}%"></i>`;
 let pb=50,pv=v!=null?pos(v):null;

 h+=`<i class="mn" style="top:50%"></i>`;if(pv!=null)h+=`<i class="md" style="top:${pv}%;background:${col}"></i>`;
 let lb=50,lv=pv;if(lv!=null&&Math.abs(lv-lb)<14){const d=lv<=lb?-1:1;const mid=(lb+lv)/2;lb=mid-7*d;lv=mid+7*d;}
 h+=`<span class="ml" style="top:${lb}%;color:#eef2f7">${f(bet)}</span>`;if(lv!=null)h+=`<span class="ml" style="top:${lv}%;color:${col}">${f(v)}</span>`;

function lpTxt(g){const S=g.sit;if(!S)return"";const rz=S.rz?' · <span class="rz">red zone</span>':"";

 let t=String(S.lp||"").replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim();if(!t)return S.rz?`<div class="lp"><span class="rz">Red zone</span></div>`:"";
 const m=t.match(/^(Official )?Timeout/i)?"Timeout":/^End of (\d\w*|the) ?(Quarter|Half)/i.test(t)?t.replace(/\.$/,""):/^Two-Minute/i.test(t)?"Two-minute warning":null;
 if(!m){t=t.split(/,| for | at | to |\. /)[0].replace(/\.$/,"");if(t.length>34)t=t.split(" ").slice(0,4).join(" ");}
 return `<div class="lp">${esc(m||t)}${rz}</div>`;}
function hardReload(){location.replace(location.pathname+"?v="+Date.now());}
function sec(g){if(g.state==="post"||g.completed)return 0;if(g.state==="in")return 1;return 2;}
const SECN=["✅ Final","🔴 Live","🗓️ Upcoming"],SECC=["#3fae7a","#e5484d","#2b6cff"],SECK=["final","live","upcoming"];
const COLL=(()=>{try{return JSON.parse(localStorage.getItem("collapsed")||"{}")}catch(e){return{}}})();
const isC=k=>k in COLL?!!COLL[k]:/^up_/.test(k);
function section(k,title,color,body,n){const c=isC(k);return `<div class="gh${c?" closed":""}" data-k="${k}" role="button" style="border-color:${color}"><span>${title} <span class="cnt">${n}</span></span><span class="chev">▾</span></div><div class="sb" data-k="${k}"${c?" hidden":""}>${body}</div>`}
function toggleSec(k){const nc=!isC(k);if(nc===/^up_/.test(k))delete COLL[k];else COLL[k]=nc;try{localStorage.setItem("collapsed",JSON.stringify(COLL))}catch(e){}document.querySelectorAll(`[data-k="${k}"]`).forEach(e=>{if(e.classList.contains("gh"))e.classList.toggle("closed",isC(k));else e.hidden=isC(k);});}
document.addEventListener("click",e=>{const g=e.target.closest(".gh[data-k]");if(g)toggleSec(g.dataset.k);});
function kickKey(g){return g.start.toLocaleString("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hour12:false});}
function kickHM(g){return (g.start.toLocaleString("en-CA",{timeZone:"America/Los_Angeles",hour:"2-digit",minute:"2-digit",hour12:false}).split(", ").pop()||"").trim();}
function kickLab(gs){const g0=gs[0],day=g0.start.toLocaleDateString("en-US",{timeZone:"America/Los_Angeles",weekday:"short",month:"short",day:"numeric"}),mins=[...new Set(gs.map(kickHM))];
 if(mins.length===1){const tm=tf(g0.start,"America/Los_Angeles");return `${tm} PT · ${day}`;}
 const[hh]=mins[0].split(":"),h=Number(hh),ampm=h>=12?"PM":"AM",h12=((h+11)%12)+1;return `~${h12}:00 ${ampm} PT · ${day}`;}
function upcomingBody(G){const M=new Map();for(const g of G){const k=kickKey(g);if(!M.has(k))M.set(k,{gs:[]});M.get(k).gs.push(g);}let h="";for(const[k,v]of M)h+=section("up_"+k,kickLab(v.gs),SECC[2],v.gs.map(card).join(""),v.gs.length);return h;}
function card(g){const s=sec(g),fin=s===0,live=s===1,pre=s===2,a=g.away,h=g.home;
 const canceled=/POSTPONED|CANCEL|SUSPENDED/.test(g.name);
 let win=null,tie=false;if(fin&&!canceled&&a.score!=null&&h.score!=null){if(a.score>h.score)win=a;else if(h.score>a.score)win=h;else tie=true;}
 const cls=x=>win?(x===win?" w":" l"):"";
 const color=canceled?"#8a63d2":fin?(tie?"#f0b429":"#1fbf5f"):live?"#e5484d":"#2b6cff";
 const pill=canceled?"NO GAME":fin?"FINAL":live?"LIVE":"SCHEDULED";
 const kick=`${tf(g.start,"America/Los_Angeles")} PT`;
 const sc=x=>pre||x.score==null?"":`<span class="s">${x.score}</span>`;
 const where=g.neutral&&g.venue?` · ${esc(g.venue)}`:"";
 const lt=liveTxt(g),info=live?(lt?`${esc(g.detail)} · <span class="lv">Live ${esc(lt)}</span>`:`${esc(g.detail)} · kicked off ${tf(g.start,"America/Los_Angeles")} PT`):fin?`${canceled?esc(g.detail)+" · ":""}Kicked off ${kick}${where}`:`Kickoff ${kick}${where}`;
 const fl=fin&&lt?`<span class="wl">Live close ${esc(lt)}</span>`:"";const res=(win?`<div class="win">Winner: ${esc(win.name)}${fl}</div>`:tie?`<div class="win tie">Tie game ${a.score}–${h.score}${fl}</div>`:"")+(win||tie?atsTxt(g,a,h):"");
 let mt="";try{mt=meter(g)}catch(e){METERR=String(e&&e.message||e);}
 return `<div class="card${mt?" hm":""}" style="border-left-color:${color}">${mt}<div class="top"><span class="lg">NFL</span><span class="pill" style="background:${color}">${pill}</span></div>
 <div class="tm${cls(a)}"><span class="n">${esc(a.name)}${a.record?`<span class="rec">(${esc(a.record)})</span>`:""}</span>${sc(a)}</div><div class="tm${cls(h)}"><span class="n">${g.neutral?"vs ":"@ "}${esc(h.name)}${h.record?`<span class="rec">(${esc(h.record)})</span>`:""}</span>${sc(h)}</div>
 <div class="tx">${info}</div>${lineTxt(g)}${res}${live?(()=>{try{return lpTxt(g)}catch(e){return""}})():""}</div>`;}
function render(G){LASTG=G;if(WK!=null)return;const S=[[],[],[]];G.sort((x,y)=>x.start-y.start);for(const g of G)if(g.lg==="NFL")S[sec(g)].push(g);
 $("n_f").textContent=S[0].length;$("n_l").textContent=S[1].length;$("n_u").textContent=S[2].length;
 // Live view: Live + Upcoming only. Completed games live in the week picker (incl. current week).
 let h="";for(const i of [1,2]){if(S[i].length)h+=section(SECK[i],SECN[i],SECC[i],i===2?upcomingBody(S[i]):S[i].map(card).join(""),S[i].length);}
 $("games").innerHTML=h||`<div class="none">No live or upcoming NFL games — open a week above for finals.</div>`;}
async function poll(){checkVersion();try{try{const r=await fetch("odds_open.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();OPEN=j.games||{};}}catch(e){}const[G,errs]=await fetchAll();if(!G.length&&errs.length)throw new Error(errs.join("; "));await lines(G);await liveLines(G);await loadMyBets();render(G);lastOk=new Date();
 $("ts").innerHTML=`<span class="dot"></span>Updated ${lastOk.toLocaleTimeString("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"2-digit",second:"2-digit"})} PT<span style="color:#5b6575"> · v.${APP_VERSION.split(".").pop()}${BETS_OK===false?' · <span style="color:#f0b429">bets not loaded</span>':""}${METERR?' · <span style="color:#f0b429">meter error</span>':""}</span>`;
 $("err").innerHTML=errs.length?`<div class="err">⚠️ ${errs.map(esc).join("<br>")}</div>`:"";}
 catch(e){$("err").innerHTML=`<div class="err">⚠️ Couldn't update scores (${esc(e.message)})${lastOk?" — showing last good update":""}. Retrying in 30s.</div>`;}}
$("rf").addEventListener("click",hardReload);
// NFL archive: weeks in archive/nfl/2026-wkNN.json (ESPN fallback). Live view = Live+Upcoming; week picker (incl. current) = full slate.
let WKS=[];
async function loadWeeks(){const L=new Map();try{const r=await fetch("archive/nfl/index.json?t="+Date.now(),{cache:"no-store"});if(r.ok)for(const it of (await r.json()).items||[])L.set(it.week,{w:it.week,label:it.label,detail:it.detail||"",file:it.file});}catch(e){}
 try{const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?t="+Date.now(),{cache:"no-store"});if(r.ok){const d=await r.json();CURW=d.week?.number||CURW;const cw=CURW||0,cal=((d.leagues?.[0]?.calendar||[]).find(b=>String(b.value)==="2")||{}).entries||[];
  for(const en of cal){const w=+en.value;if(w&&w<=cw&&!L.has(w))L.set(w,{w,label:en.label||"Week "+w,detail:en.detail||"",file:null});}
  // Ensure current week is selectable (ESPN fallback via file=null) even if calendar miss
  if(cw&&!L.has(cw)){const en=cal.find(e=>+e.value===cw);L.set(cw,{w:cw,label:(en&&en.label)||("Week "+cw),detail:(en&&en.detail)||"",file:null});}
  if(cw){H1=`NFL Week ${cw}`;document.title=H1;if(WK==null)document.querySelector("h1").textContent=H1;}}}catch(e){}
 WKS=[...L.values()].filter(x=>!CURW||x.w<=CURW).sort((a,b)=>b.w-a.w);drawWeeks();}
function drawWeeks(){const cur="Live";$("wkp").innerHTML=`<span class="wkl">WEEKS</span><button class="wkb${WK==null?" on":""}" data-w="">${esc(cur)}</button>`+WKS.map(x=>`<button class="wkb${WK===x.w?" on":""}" data-w="${x.w}" title="${esc(x.detail||"")}">${esc(x.label.replace("Week ","Wk "))}</button>`).join("");}
$("wkp").addEventListener("click",e=>{const b=e.target.closest(".wkb");if(!b)return;const w=b.dataset.w===""?null:+b.dataset.w;showWeek(w);});
async function weekEvents(x){if(x.file){try{const r=await fetch("archive/nfl/"+x.file+"?t="+Date.now(),{cache:"no-store"});if(r.ok)return(await r.json()).events||[];}catch(e){}}
 const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${x.w}&dates=2026&t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return(await r.json()).events||[];}
async function showWeek(w){WK=w;drawWeeks();ARCO={};ARCC={};
 if(w==null){document.querySelector("h1").textContent=H1;if(LASTG)render(LASTG);poll();return;}
 const x=WKS.find(y=>y.w===w);if(!x)return;const ttl=x.detail?`NFL ${x.label} · ${x.detail}`:`NFL ${x.label}`;
 document.querySelector("h1").textContent=ttl;$("games").innerHTML=`<div class="none">Loading ${esc(x.label)}…</div>`;
 try{const ev=await weekEvents(x);if(WK!==w)return;
  for(const e of ev){const o=e.odds;if(o){if(o.open)ARCO[e.id]={open_spread:o.open.d,open_total:o.open.ou};if(o.close)ARCC[e.id]={d:o.close.d,ou:o.close.ou};}}
  // Full week slate together (finals + live + upcoming), grouped by PT day
  const G=ev.map(e=>parse("NFL",e)).sort((a,b)=>a.start-b.start),D=new Map(),S=[0,0,0];
  for(const g of G){S[sec(g)]++;const k=g.start.toLocaleDateString("en-US",{timeZone:"America/Los_Angeles",weekday:"short",month:"short",day:"numeric"});if(!D.has(k))D.set(k,[]);D.get(k).push(g);}
  $("n_f").textContent=S[0];$("n_l").textContent=S[1];$("n_u").textContent=S[2];
  let h="";for(const[k,L]of D){const allF=L.every(g=>sec(g)===0),anyL=L.some(g=>sec(g)===1);
   const lab=(allF?"✅ ":anyL?"🔴 ":"🗓️ ")+k,col=allF?"#3fae7a":anyL?"#e5484d":"#2b6cff";
   h+=section("wk"+w+"_"+k,lab,col,L.map(card).join(""),L.length);}
  $("games").innerHTML=h||`<div class="none">No games for ${esc(x.label)}.</div>`;}
 catch(e){if(WK===w)$("games").innerHTML=`<div class="err">⚠️ Couldn't load ${esc(x.label)} (${esc(e.message)})</div>`;}}
loadWeeks();
(()=>{let y0=null,dy=0;const P=$("ptr"),sp=P.firstChild;
