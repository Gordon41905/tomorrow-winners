async function liveOdds(g){try{const p=g.lg==="NFL"?"nfl":"college-football";const r=await fetch(`https://sports.core.api.espn.com/v2/sports/football/leagues/${p}/events/${g.id}/competitions/${g.id}/odds?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)return null;const d=await r.json();
 const x=(d.items||[]).find(i=>(String(i.provider?.id)==="200"||/live/i.test(i.provider?.name||""))&&(i.details||i.overUnder!=null||i.spread!=null));if(!x)return null;

function liveTxt(g){const L=(OL[g.id]||{}).live;if(!L)return"";if(g.state==="in"&&Date.now()-L.at>300000)return"";const t=fmt(L);return t?t:"";}

 const J=OPEN[g.id],op=J?{d:J.open_spread,ou:J.open_total}:(L.copen||L.open||null);const a=fmt(op),b=fmt(now);if(!a&&!b)return"";

function atsTxt(g,a,h){const L=OL[g.id]||{},J=OPEN[g.id],op=J?{d:J.open_spread,ou:J.open_total}:(L.copen||null);const mg=h.score-a.score,T=a.score+h.score;
 let sp="spread open n/a",ou="O/U open n/a";const d=op&&op.d!=null?String(op.d).trim():"";
 if(/^(even|pk|pick)/i.test(d)){const w=mg>0?h.ab:mg<0?a.ab:null;sp=w?`PK (open): ${esc(w)} covered`:"PK (open): push";}
 else{const m=d.match(/^([A-Za-z]+)\s+([+-]?\d+(?:\.\d+)?)$/);if(m){const ab=m[1],ln=Number(m[2]),me=ab===h.ab?mg:ab===a.ab?-mg:null;if(me!=null){const c=me+ln;sp=`<b>${esc(ab)} ${ln>0?"+":""}${ln}</b> (open) ${c>0?"covered":c===0?"push":"didn't cover"}`;}}}
 const ol=op&&op.ou!=null&&op.ou!==""?Number(op.ou):NaN;if(isFinite(ol))ou=`<b>${T>ol?"Over":T<ol?"Under":"Push"} ${ol}</b> (open), ${T}`;

let MYTOT=[],SCP={};
const gmin=(p,c)=>{const m=String(c||"").match(/(\d+):(\d+)/),left=m?(+m[1])+(+m[2])/60:0;return p<=4?(p-1)*15+15-left:60+(p-5)*10+10-left;};
async function fetchScoring(G){await Promise.all(G.filter(g=>sec(g)===1&&myTot(g).length).map(async g=>{try{const p=g.lg==="NFL"?"nfl":"college-football";const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/${p}/summary?event=${g.id}&t=${Date.now()}`,{cache:"no-store"});if(!r.ok)return;const d=await r.json();
 SCP[g.id]=(d.scoringPlays||[]).map(x=>[gmin(x.period?.number||1,x.clock?.displayValue),(+x.awayScore||0)+(+x.homeScore||0)]).filter(x=>isFinite(x[0])&&isFinite(x[1])).sort((a,b)=>a[0]-b[0]);}catch(e){}}));}
function spark(g,T){const P=SCP[g.id];if(!P||T==null)return"";const now=Math.max(0,gmin(g.per||1,g.clk)),w0=Math.max(0,now-15),win=now-w0;if(win<=0)return"";
 const at=t=>{let v=0;for(const[x,y]of P)if(x<=t)v=y;return v;},base=at(w0),dl=T-base,ym=Math.max(7,dl),X=t=>((t-w0)/win*36+1).toFixed(1),Y=v=>(15-(v-base)/ym*14).toFixed(1);

async function loadMyBets(){try{const r=await fetch("https://gordon41905.github.io/bet-dashboard/bets.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const d=await r.json(),out=[];
 for(const t of d.tickets||[])for(const l of t.legs||[]){if(l.type!=="tot")continue;const n=(d.nfl_games||{})[l.game],c=(d.cfb_games||{})[l.game],e=n||c;if(!e)continue;
  out.push({lg:n?"NFL":"College",home:e[0],away:e[1],date:e[2]||null,line:Number(l.line),ou:l.ou,straight:(t.legs||[]).length===1});}

function myTot(g){return MYTOT.filter(b=>b.lg===g.lg&&(!b.date||b.date===DATE)&&(b.lg==="NFL"?(g.home.full===b.home&&g.away.full===b.away):(g.home.full.startsWith(b.home)&&g.away.full.startsWith(b.away))));}
function meter(g){if(sec(g)!==1)return"";const B=myTot(g);if(!B.length)return"";const S=B.filter(b=>b.straight),P=(S.length?S:B)[0],bet=P.line,ou=P.ou,L=OL[g.id]||{},s=sec(g);
 const num=x=>{const n=x==null||x===""?NaN:Number(x);return isFinite(n)?n:null};
 const v=num((L.live||{}).ou)??num((L.pre||L.cur||{}).ou)??num((g.od||{}).ou);

 const res=(ln,o)=>T==null||canc?null:T>ln?(o==="o"?"won":"lost"):null;
 const sk=spark(g,T),mb=sk?' style="bottom:48px"':"";const R=res(bet,ou);if(R){const sc={won:"#1fbf5f",lost:"#e5484d"}[R];const dif=B.filter(b=>b.line!==bet||b.ou!==ou).map(b=>[b,res(b.line,b.ou)]).filter(([b,r])=>r!==R).map(([b,r])=>`${f(b.line)} ${r||"open"}`);
  const tl=`Your ${ou==="o"?"over":"under"} ${bet}: ${R} (${T} points so far)${dif.length?" · "+dif.join(", "):""}`;
  return `<div class="mtr" title="${esc(tl)}" style="background:${sc}${sk?";bottom:48px":""}"><span class="ml" style="top:38%;color:${sc}">${R.toUpperCase()}</span><span class="ml" style="top:52%;color:#eef2f7">${T}</span>${dif.map((x,i)=>`<span class="ml" style="top:${66+i*11}%;color:#8b97a8;font-weight:700;font-size:8.5px">${esc(x)}</span>`).join("")}</div>`+sk;}
 const rng=Math.max(8,(v!=null?Math.abs(v-bet):0)+3,...sec2.map(x=>Math.abs(x-bet)+1)),pos=x=>Math.min(100,Math.max(0,(bet+rng-x)/(2*rng)*100));

function sec(g){if(g.state==="post"||g.completed)return 0;if(g.state==="in")return 1;return 2;}
const SECN=["✅ Final","🔴 Live","🗓️ Upcoming"],SECC=["#3fae7a","#e5484d","#2b6cff"],SECK=["final","live","upcoming"];
const COLL=(()=>{try{return JSON.parse(localStorage.getItem("collapsed")||"{}")}catch(e){return{}}})();
function section(k,title,color,body,n){const c=!!COLL[k];return `<div class="gh${c?" closed":""}" data-k="${k}" role="button" style="border-color:${color}"><span>${title} <span class="cnt">${n}</span></span><span class="chev">▾</span></div><div class="sb" data-k="${k}"${c?" hidden":""}>${body}</div>`}

function card(g){const s=sec(g),fin=s===0,live=s===1,pre=s===2,a=g.away,h=g.home;
 const canceled=/POSTPONED|CANCEL|SUSPENDED/.test(g.name);

function render(G){const S=[[],[],[]],C=[[],[],[]];G.sort((x,y)=>x.start-y.start||(x.lg<y.lg?-1:1));for(const g of G)(g.lg==="NFL"?S:C)[sec(g)].push(g);
 S[0].reverse();C[0].reverse();
 $("n_f").textContent=S[0].length+C[0].length;$("n_l").textContent=S[1].length+C[1].length;$("n_u").textContent=S[2].length+C[2].length;
 let h="";for(const i of [1,2,0]){if(S[i].length)h+=section(SECK[i],SECN[i],SECC[i],S[i].map(card).join(""),S[i].length);}
 const cf=[...C[1],...C[2],...C[0]];if(cf.length)h+=section("college","🏈 College football","#9b59ff",cf.map(card).join(""),cf.length);else if(cfbCount===0)h+=`<div class="none">No college games Sunday, Oct 18.</div>`;
 $("games").innerHTML=h||`<div class="none">No games found for Sunday, Oct 18.</div>`;}
async function poll(){checkVersion();try{try{const r=await fetch("odds_open.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();OPEN=j.games||{};}}catch(e){}const[G,errs]=await fetchAll();if(!G.length&&errs.length)throw new Error(errs.join("; "));await lines(G);await liveLines(G);await loadMyBets();await fetchScoring(G);render(G);lastOk=new Date();
 $("ts").innerHTML=`<span class="dot"></span>Updated ${lastOk.toLocaleTimeString("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"2-digit",second:"2-digit"})} PT`;
 $("err").innerHTML=errs.length?`<div class="err">⚠️ ${errs.map(esc).join("<br>")}</div>`:"";}
 catch(e){$("err").innerHTML=`<div class="err">⚠️ Couldn't update scores (${esc(e.message)})${lastOk?" — showing last good update":""}. Retrying in 30s.</div>`;}}
poll();setInterval(poll,30000);
</script></body></html>
